<!doctype html>
<html lang="bg">
<head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width,initial-scale=1" />
   <title>Biocore Web</title>
   <link rel="stylesheet" href="css/styles.css" />
 </head>
<body>
   <header>
      <div class="header-row">
         <img src="images/logo.png" alt="Biocore logo" id="logo" onerror="this.style.display='none'" />
         <h1>Biocore — Калкулатор на калории</h1>
         <button id="btnReload" class="small btn-sync">SYNC</button>
      </div>
   </header>

   <div id="headerSteps" style="text-align:center;margin-top:8px;">
      <div id="tvStepCount">Стъпки: 0</div>
      <div class="step-progress" aria-hidden="true" style="margin:10px auto;max-width:320px;"><div id="stepBar" class="step-bar"></div></div>
   </div>
   <section id="topCards" class="cards-grid" style="padding:10px;">
      <div class="card" id="cardHR">HR<br><span class="card-value" id="tvHR">-</span></div>
      <div class="card" id="cardTotalOut">Total Out<br><span class="card-value" id="tvTotalOut">-</span></div>
      <div class="card" id="cardDailyBalance">Balance<br><span class="card-value" id="tvDailyBalance">-</span></div>
      <div class="card" id="cardActiveKcal">Active Kcal<br><span class="card-value" id="tvActiveKcal">-</span></div>
   </section>
   <main>
      <form id="foodForm">
         <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <input id="foodName" placeholder="Храна" required />
            <input id="grams" type="number" placeholder="Грама" required />
            <input id="calPer100" type="number" placeholder="Кал/100г" required />
            <input id="fastCarbs" type="number" placeholder="Fast carbs (g)" />
            <input id="slowCarbs" type="number" placeholder="Slow carbs (g)" />
            <input id="proteins" type="number" placeholder="Proteins (g)" />
            <input id="fats" type="number" placeholder="Fats (g)" />
            <button type="submit">Добави</button>
         </div>
      </form>

      <section id="quickActions" style="margin-bottom:12px;display:flex;gap:8px;align-items:center;">
         <button id="btnEditKcal" class="small btn-edit">Edit KCAL</button>
         <button id="btnEditHR" class="small btn-edit">Edit HR</button>
         <button id="btnEditFood" class="small btn-food">Edit Food</button>
      </section>

      <section id="stepPanel" style="margin-bottom:12px;padding:10px;border-radius:6px;background:#F0F7FF;">
         <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
               <div id="tvStepCount">Стъпки: 0</div>
               <div class="step-progress" aria-hidden="true"><div id="stepBar" class="step-bar"></div></div>
            </div>
            <div id="tvTopMetabolic">Метаболичен статус: -</div>
         </div>
      </section>

      <section id="nutritionStatus" style="margin-bottom:12px;padding:10px;border:1px solid #ddd;border-radius:6px;">
         <div id="tvFineNutritionStatus" style="font-family:monospace;white-space:pre-wrap;">Nutrition log will appear here</div>
      </section>

      <section id="fineBottom" style="margin-bottom:12px;padding:10px;border-radius:6px;background:transparent;border:1px solid #222;">
         <div style="margin-bottom:8px;font-weight:600;color:#ccc">Glycogen Tank</div>
         <div style="height:22px;background:#222;border-radius:4px;overflow:hidden;position:relative;">
            <div id="glycogenBar" style="height:100%;width:0%;background:#2a9d8f;color:white;display:flex;align-items:center;justify-content:center;font-size:12px">0 g</div>
         </div>
         <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;color:#ddd">
            <div id="tvBloodInflux">Blood Influx: 0.00 g/min</div>
            <div id="tvMetabolicStatus">Метаболичен статус: -</div>
         </div>
      </section>

      <section id="logPanel" style="margin-bottom:12px;padding:10px;border-radius:6px;background:#F0F7FF;">
         <div id="log" style="font-size:13px;color:#073e6b;">Log panel</div>
      </section>

      <table id="list">
         <thead>
            <tr><th>Време</th><th>Храна</th><th>г</th><th>кал</th><th></th></tr>
         </thead>
         <tbody></tbody>
      </table>

      <div id="totals">Общо калории: <span id="total">0</span></div>
   </main>
   <footer id="bottomBar">
      <button id="btnSteps" class="bottom-btn">STEPS</button>
      <button id="btnProfile" class="bottom-btn">PROFILE</button>
      <button id="btnJson" class="bottom-btn">JSON</button>
   </footer>
   <script src="js/calc.js"></script>
   <script src="js/app.js"></script>
</body>
</html>
