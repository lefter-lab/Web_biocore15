<!doctype html>
<html lang="bg">
<head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Biocore Web</title>
    <link rel="icon" href="data:,">
   <link rel="stylesheet" href="css/styles.css" />
 </head>
<body>
   <div id="loginGate" class="login-gate">
      <div class="login-gate__content">
         <h2>Добре дошли в BioCore15.</h2>
         <p class="login-gate__subtitle">Моля, влезте в профила си, за да продължите.</p>
         <div id="authStatus" class="login-gate__status">Не сте логнати</div>
         
         <div id="authPanel" class="auth-panel">
            <button id="googleBtn" class="btn-google">Влез с Google</button>
            
            <form id="emailAuthForm" class="auth-panel__form">
               <input id="emailInput" type="email" placeholder="Email" required />
               <input id="passwordInput" type="password" placeholder="Парола" required />
               <button id="loginBtn" type="submit" class="btn-email">Влез</button>
            </form>
         </div>

         <div class="signup-row">
            <button id="showSignupBtn" class="link-button">Нямате акаунт? Регистрирайте се</button>
         </div>

         <div id="signupForm" class="signup-form hidden">
            <input id="signupEmail" type="email" placeholder="Нов Email" />
            <input id="signupPassword" type="password" placeholder="Нова Парола" />
            <button id="doSignupBtn" class="btn-signup">Създай акаунт</button>
            <button id="hideSignupBtn" class="link-button">Назад към вход</button>
         </div>
      </div>
   </div>

   <div id="appShell" class="hidden">
      <header>
         <div class="header-row" style="justify-content: space-between; display: flex; align-items: center; width: 100%;">
            <div style="display: flex; align-items: center; gap: 12px;">
               <img id="ivLogo" src="logo_biocore.jpg" alt="Logo" style="height: 50px; border-radius: 8px;" />
               <h1 style="margin:0;">BioCore15</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 15px;">
               <span id="userName" style="font-weight: 600; color: #6fdcba;"></span>
               <button id="logoutBtn" class="small" style="background: #333; color: #fff; border: 1px solid #444; cursor: pointer; padding: 5px 10px; border-radius: 5px;">Изход</button>
            </div>
         </div>
      </header>

      <main>
         <section class="cards-grid">
            <div class="card">
               <div class="card-label">Balance <span class="info-badge" title="Дневен калориен излишък/дефицит на база BMR и активност.">?</span></div>
               <div id="tvBalance" class="card-value">0</div>
            </div>
            <div class="card">
               <div class="card-label">Total Out <span class="info-badge" title="Общо изгорени калории от 00:00 часа (BMR + активност).">?</span></div>
               <div id="tvTotalOut" class="card-value">0</div>
               <div id="tvPhase" class="card-subtext">Phase: --</div>
            </div>
            <div class="card">
               <div class="card-label">HR <span class="info-badge" title="Пулс в реално време или последно измерване.">?</span></div>
               <div id="tvHR" class="card-value">--</div>
            </div>
            <div class="card">
               <div class="card-label">Meals (kcal)</div>
               <div id="tvMeals" class="card-value">0</div>
            </div>
         </section>

         <div style="margin-top:20px; display:flex; gap:12px;">
            <div style="flex:1; max-height:320px; overflow:auto; background:#000; padding:10px; border-radius:6px; border:1px solid #222">
               <div style="font-weight:600; margin-bottom:8px; color:#9fdbb5">Today's meals (copy-paste friendly)</div>
               <pre id="jsonList" style="color:#ddd; white-space:pre-wrap; font-family:monospace; font-size:13px"></pre>
            </div>
         </div>
      </main>
   </div>

   <script type="module" src="js/calc.js"></script>
</body>
</html>
