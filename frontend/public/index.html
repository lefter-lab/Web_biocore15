<!doctype html>
<html lang="bg">
<head>
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width,initial-scale=1" />
   <title>Biocore Web</title>
   <link rel="stylesheet" href="css/styles.css" />
 </head>
<body>
   <header>
      <div class="header-row">
         <img src="images/logo.png" alt="Biocore logo" id="logo" onerror="this.style.display='none'" />
         <h1>Biocore — Калкулатор на калории</h1>
         <button id="btnReload" class="small">SYNC</button>
      </div>
   </header>
   <main>
      <form id="foodForm">
         <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <input id="foodName" placeholder="Храна" required />
            <input id="grams" type="number" placeholder="Грама" required />
            <input id="calPer100" type="number" placeholder="Кал/100г" required />
            <input id="fastCarbs" type="number" placeholder="Fast carbs (g)" />
            <input id="slowCarbs" type="number" placeholder="Slow carbs (g)" />
            <input id="proteins" type="number" placeholder="Proteins (g)" />
            <input id="fats" type="number" placeholder="Fats (g)" />
            <button type="submit">Добави</button>
         </div>
      </form>

      <section id="quickActions" style="margin-bottom:12px;display:flex;gap:8px;align-items:center;">
         <button id="btnEditKcal" class="small">Edit KCAL</button>
         <button id="btnEditHR" class="small">Edit HR</button>
         <button id="btnEditFood" class="small">Edit Food</button>
      </section>

      <section id="stepPanel" style="margin-bottom:12px;padding:10px;border-radius:6px;background:#F0F7FF;">
         <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
               <div id="tvStepCount">Стъпки: 0</div>
               <div class="step-progress" aria-hidden="true"><div id="stepBar" class="step-bar"></div></div>
            </div>
            <div id="tvMetabolicStatus">Метаболичен статус: -</div>
         </div>
      </section>

      <section id="nutritionStatus" style="margin-bottom:12px;padding:10px;border:1px solid #ddd;border-radius:6px;">
         <div id="tvFineNutritionStatus" style="font-family:monospace;white-space:pre-wrap;">Nutrition log will appear here</div>
      </section>

      <section id="logPanel" style="margin-bottom:12px;padding:10px;border-radius:6px;background:#F0F7FF;">
         <div id="log" style="font-size:13px;color:#073e6b;">Log panel</div>
      </section>

      <table id="list">
         <thead>
            <tr><th>Време</th><th>Храна</th><th>г</th><th>кал</th><th></th></tr>
         </thead>
         <tbody></tbody>
      </table>

      <div id="totals">Общо калории: <span id="total">0</span></div>
   </main>
   <script src="js/app.js"></script>
</body>
</html>
